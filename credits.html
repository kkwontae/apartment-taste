<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 출처</title>
<style>
  :root { --bg: #F6F2EC; --card: #FFFDFA; --ink: #2A2622; --muted: #857B70; --line: #E4DCD1; --accent: #9B6B43; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; } a { color: var(--accent); } li { margin: 6px 0; } .small { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
<p><a href="./">← 취향 리포트로</a></p>
<h1>사진 출처·라이선스</h1>
<p id="base"></p>
<p>아래 사진은 저작자 표시가 필요한 라이선스로 사용했어요. 모든 사진은 크기를 줄이고 WebP로 변환했어요.</p>
<ul id="list"></ul>
<p class="small">견본 그림(벽지·타일·손잡이 등)은 이 사이트에서 직접 그린 것이에요.</p>
</main>
<script src="data.js"></script>
<script src="photos.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ccUrl = l => { const m = /^CC (BY(?:-SA)?) ([\d.]+)$/.exec(l); return m ? `https://creativecommons.org/licenses/${m[1].toLowerCase()}/${m[2]}/` : ''; };
const c = DATA.credits;
document.getElementById('base').innerHTML = `그 밖의 사진은 <a href="${esc(c.src)}">${esc(c.by)}</a> 등에서 받은 ${esc(c.license)}(퍼블릭 도메인) 사진이에요.`;
document.getElementById('list').innerHTML = Object.entries(PHOTO_CREDITS).map(([id, x]) => { const u = ccUrl(x.license), alt = PHOTOS[id] ? PHOTOS[id].alt : id;
  return `<li>${esc(alt)} — <a href="${esc(x.src)}">원본</a>, ${esc(x.by)}, ${u ? `<a href="${u}">${esc(x.license)}</a>` : esc(x.license)}</li>`; }).join('');
</script>
</body>
</html>
